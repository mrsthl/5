name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # npm publish defaults to the `latest` dist-tag and does NOT special-case
          # semver prereleases. Publishing 3.0.0-beta-N without an explicit --tag
          # would serve the beta to every `npx foifi` and to `/5:update`, which runs
          # `npx foifi@latest --upgrade`. Derive the tag from the version instead.
          if [[ "$VERSION" == *-* ]]; then
            echo "dist_tag=beta" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "Publishing PRERELEASE $VERSION to dist-tag 'beta'"
          else
            echo "dist_tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Publishing $VERSION to dist-tag 'latest'"
          fi

      - name: Update package.json version
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Needed locally so `npm publish` ships the tagged version
          npm version $VERSION --no-git-tag-version --allow-same-version

          # Only sync the bump back to main for stable releases. A prerelease must
          # not move main's version off the stable line — that is what forced the
          # "reset version to 2.0.6" walk-back after 3.0.0-beta-1.
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            echo "Prerelease — leaving main's package.json untouched"
            exit 0
          fi

          # Commit the version change back to the repository
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Check if there are changes to commit
          if git diff --quiet; then
            echo "No changes to package.json"
          else
            git add package.json package-lock.json 2>/dev/null || git add package.json
            git commit -m "chore: bump version to $VERSION [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish to npm (foifi)
        run: npm publish --tag ${{ steps.version.outputs.dist_tag }} --access public --provenance

      # MIGRATION: also publish under the legacy package name so existing users
      # receive the update transparently. Remove this step after v2.0.0 stable.
      - name: Publish to npm (5-phase-workflow legacy)
        run: |
          VERSION=${{ steps.version.outputs.version }}
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '5-phase-workflow';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --tag ${{ steps.version.outputs.dist_tag }} --access public --provenance
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = 'foifi';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const tag = context.ref.replace('refs/tags/', '');
            const prerelease = '${{ steps.version.outputs.prerelease }}' === 'true';

            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `v${version}`,
                body: `Release version ${version}`,
                draft: false,
                prerelease
              });
            } catch (error) {
              if (error.status === 422) {
                console.log('Release already exists');
              } else {
                throw error;
              }
            }
